name: Lint

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ShellCheck
        # Pin to a tag, not master — master means "trust whatever ludeeus
        # pushes next" which is a supply-chain risk for any action.
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

      - name: stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check stow/nvim/.config/nvim

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
