# Only github-actions is configured: this repo has no Go/pip/npm manifests for
# Dependabot to scan, so those ecosystems were removed as dead config.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
