# == ssh personal overlay ==
# Dropped into ~/.ssh/config.d/ by the `ssh-personal` Stow package; the base
# ~/.ssh/config Includes this file at the top, so these Host blocks override
# the default `Host *` block below them.

# Personal GitHub account — used for git@github-personal:... remotes.
Host github-personal
  HostName github.com
  User git
  IdentityFile ~/.ssh/ed25519_github
  IdentitiesOnly yes
  AddKeysToAgent yes
  UseKeychain yes
  ForwardAgent no

# Plain `git@github.com:...` defaults to the personal key on personal machines.
Host github
  HostName github.com
  User git
  IdentityFile ~/.ssh/ed25519_github
  IdentitiesOnly yes
  AddKeysToAgent yes
  UseKeychain yes
