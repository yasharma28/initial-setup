# == ssh work overlay ==
# Dropped into ~/.ssh/config.d/ by the `ssh-work` Stow package. Work-only
# Host blocks live here so they don't ship to personal machines.

# Work GitHub account — used for git@github-work:... remotes.
Host github-work
  HostName github.com
  User git
  IdentityFile ~/.ssh/id_ed25519_giantanalytics
  IdentitiesOnly yes
  AddKeysToAgent yes
  UseKeychain yes
  ForwardAgent no

# Plain `git@github.com:...` defaults to the work key on work machines.
Host github
  HostName github.com
  User git
  IdentityFile ~/.ssh/id_ed25519_giantanalytics
  IdentitiesOnly yes
  AddKeysToAgent yes
  UseKeychain yes

